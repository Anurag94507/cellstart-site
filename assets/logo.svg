<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base -->
  <rect x="20" y="20" width="160" height="160" rx="42" fill="url(#logoGrad)"/>
  <!-- Inner tech ring -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- Core hexagon -->
  <polygon points="100,50 142,75 142,125 100,150 58,125 58,75" fill="#0f172a" stroke="rgba(56,189,248,0.5)" stroke-width="2"/>
  <!-- Glowing Lightning Bolt -->
  <polygon points="108,62 82,102 102,102 92,138 122,96 102,96" fill="url(#boltGrad)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="3" fill="#ffffff"/>
</svg>
