<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOrg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgOrg)" rx="16"/>

  <!-- 5-Pack Magnetic Silicone Clips Array -->
  <g transform="translate(140, 160)">
    <!-- Clip 1 Cyan -->
    <circle cx="40" cy="40" r="30" fill="#0ea5e9" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="40" cy="40" r="12" fill="#0f172a"/>
    <rect x="36" y="10" width="8" height="30" rx="4" fill="#0f172a"/>

    <!-- Clip 2 Emerald -->
    <circle cx="110" cy="40" r="30" fill="#10b981" stroke="#34d399" stroke-width="2"/>
    <circle cx="110" cy="40" r="12" fill="#0f172a"/>
    <rect x="106" y="10" width="8" height="30" rx="4" fill="#0f172a"/>

    <!-- Clip 3 Amber -->
    <circle cx="180" cy="40" r="30" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="180" cy="40" r="12" fill="#0f172a"/>
    <rect x="176" y="10" width="8" height="30" rx="4" fill="#0f172a"/>

    <!-- Clip 4 Purple -->
    <circle cx="250" cy="40" r="30" fill="#8b5cf6" stroke="#c084fc" stroke-width="2"/>
    <circle cx="250" cy="40" r="12" fill="#0f172a"/>
    <rect x="246" y="10" width="8" height="30" rx="4" fill="#0f172a"/>

    <!-- Clip 5 Slate -->
    <circle cx="320" cy="40" r="30" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="320" cy="40" r="12" fill="#0f172a"/>
    <rect x="316" y="10" width="8" height="30" rx="4" fill="#0f172a"/>
  </g>

  <!-- Magnetic Base Strip -->
  <rect x="160" y="260" width="280" height="24" rx="12" fill="#1e293b" stroke="#64748b"/>
  <text x="300" y="276" text-anchor="middle" fill="#94a3b8" font-size="9" font-family="system-ui" font-weight="bold">DESK MAGNETIC DOCK BAR</text>

  <rect x="420" y="30" width="150" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="495" y="51" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold">🧲 5-PACK ESSENTIAL</text>
</svg>
