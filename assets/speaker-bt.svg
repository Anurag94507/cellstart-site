<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSpk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgSpk)" rx="16"/>

  <ellipse cx="300" cy="350" rx="110" ry="20" fill="#020617" opacity="0.6"/>

  <!-- Cylindrical Waterproof Speaker Body -->
  <rect x="230" y="90" width="140" height="240" rx="40" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Fabric Mesh Grill Pattern -->
  <rect x="245" y="110" width="110" height="200" rx="30" fill="#0b1120"/>
  <circle cx="300" cy="180" r="36" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 4"/>
  <circle cx="300" cy="180" r="16" fill="url(#neonPulse)"/>

  <!-- Bass Radiator Rings Top & Bottom -->
  <ellipse cx="300" cy="98" rx="45" ry="10" fill="#334155" stroke="#38bdf8"/>
  <ellipse cx="300" cy="322" rx="45" ry="10" fill="#334155" stroke="#38bdf8"/>

  <!-- Control Buttons on Side -->
  <circle cx="300" cy="265" r="8" fill="#38bdf8"/>
  <rect x="270" y="262" width="14" height="6" rx="2" fill="#64748b"/>
  <rect x="316" y="262" width="14" height="6" rx="2" fill="#64748b"/>

  <rect x="410" y="30" width="160" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="490" y="51" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold">🔊 IPX7 WATERPROOF</text>
</svg>
