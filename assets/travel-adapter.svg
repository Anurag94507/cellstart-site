<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="adBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cubeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#adBg)" rx="16"/>

  <!-- Shadow -->
  <ellipse cx="300" cy="340" rx="130" ry="22" fill="#020617" opacity="0.6"/>

  <!-- Adapter Cube -->
  <rect x="210" y="110" width="180" height="190" rx="24" fill="url(#cubeBody)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Universal Socket Face -->
  <rect x="230" y="130" width="140" height="110" rx="14" fill="#0b1120" stroke="#334155" stroke-width="1"/>
  <!-- US Pin Holes -->
  <rect x="260" y="150" width="8" height="24" rx="2" fill="#64748b"/>
  <rect x="332" y="150" width="8" height="24" rx="2" fill="#64748b"/>
  <!-- Ground Hole / UK -->
  <rect x="296" y="145" width="8" height="18" rx="2" fill="#475569"/>
  <!-- EU Round Sockets -->
  <circle cx="270" cy="205" r="7" fill="#64748b"/>
  <circle cx="330" cy="205" r="7" fill="#64748b"/>

  <!-- Bottom Fast Charging Ports -->
  <rect x="235" y="255" width="36" height="14" rx="6" fill="#020617" stroke="#38bdf8" stroke-width="1"/>
  <rect x="282" y="255" width="36" height="14" rx="6" fill="#020617" stroke="#38bdf8" stroke-width="1"/>
  <rect x="329" y="255" width="36" height="14" rx="3" fill="#020617" stroke="#f59e0b" stroke-width="1"/>

  <!-- Slider Buttons on Left -->
  <rect x="195" y="140" width="15" height="25" rx="4" fill="#38bdf8"/>
  <rect x="195" y="180" width="15" height="25" rx="4" fill="#64748b"/>
  <rect x="195" y="220" width="15" height="25" rx="4" fill="#64748b"/>

  <!-- Slider Buttons on Right -->
  <rect x="390" y="160" width="15" height="25" rx="4" fill="#64748b"/>

  <!-- Global travel badge -->
  <rect x="410" y="30" width="160" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="490" y="51" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold">🌍 150+ COUNTRIES</text>
</svg>
