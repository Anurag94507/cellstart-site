<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3in1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg3in1)" rx="16"/>

  <ellipse cx="300" cy="345" rx="160" ry="24" fill="#020617" opacity="0.6"/>

  <!-- Base with AirPods Wireless Indentation -->
  <rect x="180" y="300" width="240" height="35" rx="16" fill="#334155" stroke="#64748b"/>
  <ellipse cx="330" cy="312" rx="30" ry="8" fill="#1e293b"/>
  <text x="330" y="328" text-anchor="middle" fill="#94a3b8" font-size="8" font-family="system-ui">5W AirPods Pad</text>

  <!-- Left Stem: 15W Floating MagSafe Phone -->
  <path d="M 230,300 L 230,170" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  <g transform="translate(230, 160) rotate(-15)">
    <circle cx="0" cy="0" r="46" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="16 6"/>
    <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-size="9" font-weight="bold">15W Qi2</text>
  </g>

  <!-- Right Stem: Apple Watch Magnetic Charger -->
  <path d="M 370,300 L 370,220" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(370, 210) rotate(15)">
    <circle cx="0" cy="0" r="24" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="#0b1120"/>
    <text x="0" y="3" text-anchor="middle" fill="#10b981" font-size="7" font-weight="bold">Watch 5W</text>
  </g>

  <rect x="390" y="30" width="180" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="480" y="51" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold">⚡ 3-IN-1 DESK TREE</text>
</svg>
