<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg140" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="metal140" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow140"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg140)" rx="16"/>
  <circle cx="300" cy="200" r="140" fill="#0ea5e9" opacity="0.12" filter="url(#glow140)"/>
  
  <!-- Shadow -->
  <ellipse cx="300" cy="345" rx="170" ry="24" fill="#020617" opacity="0.7"/>

  <!-- Desktop Station Body -->
  <rect x="180" y="80" width="240" height="240" rx="24" fill="url(#metal140)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="195" y="95" width="210" height="210" rx="16" fill="#0b1120" opacity="0.9"/>

  <!-- Ports Row -->
  <g transform="translate(230, 115)">
    <!-- USB-C1 140W -->
    <rect x="0" y="0" width="140" height="24" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="16" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="900">C1: 140W PD 3.1 (EPR)</text>
    
    <!-- USB-C2 100W -->
    <rect x="0" y="36" width="140" height="24" rx="8" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="52" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="800">C2: 100W Fast PD</text>

    <!-- USB-C3 30W -->
    <rect x="0" y="72" width="140" height="24" rx="8" fill="#020617" stroke="#64748b" stroke-width="1.5"/>
    <text x="14" y="88" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="600">C3: 30W Phone/iPad</text>

    <!-- USB-A 22.5W -->
    <rect x="0" y="108" width="140" height="26" rx="6" fill="#020617" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="125" fill="#f59e0b" font-family="system-ui" font-size="11" font-weight="700">USB-A: 22.5W QC</text>
  </g>

  <!-- Power Status LED Indicator -->
  <circle cx="300" cy="285" r="4" fill="#10b981" filter="url(#glow140)"/>
  <text x="300" y="298" text-anchor="middle" fill="#64748b" font-family="system-ui" font-size="10" font-weight="700" letter-spacing="2">140W TOTAL OUTPUT</text>

  <!-- Badge -->
  <rect x="400" y="30" width="170" height="32" rx="16" fill="rgba(14, 165, 233, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="485" y="51" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold">⚡ 140W DESKTOP HUB</text>
</svg>
