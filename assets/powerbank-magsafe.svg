<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgMag)" rx="16"/>

  <ellipse cx="300" cy="345" rx="120" ry="20" fill="#020617" opacity="0.6"/>

  <!-- MagSafe Slim Pack with Kickstand -->
  <rect x="210" y="90" width="180" height="230" rx="28" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="220" y="100" width="160" height="210" rx="20" fill="#0f172a"/>

  <!-- Magnetic Ring -->
  <circle cx="300" cy="180" r="45" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="24 6"/>
  <rect x="297" y="235" width="6" height="18" rx="3" fill="#38bdf8"/>
  <circle cx="300" cy="180" r="10" fill="#38bdf8" opacity="0.3"/>

