<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glassGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.1)"/>
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.2)"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgScreen)" rx="16"/>

  <!-- Alignment Installation Tray Base -->
  <rect x="200" y="70" width="200" height="280" rx="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- 9H Diamond Tempered Glass Layer -->
  <rect x="220" y="90" width="160" height="240" rx="20" fill="url(#glassGleam)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  
  <!-- Oleophobic Reflection Sheen Line -->
  <line x1="230" y1="110" x2="370" y2="290" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <line x1="250" y1="110" x2="370" y2="260" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Speaker cutout -->
  <rect x="280" y="98" width="40" height="4" rx="2" fill="#0b1120"/>

  <text x="300" y="358" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="bold">AUTO-ALIGN 5-SEC DUST-FREE TRAY</text>

  <rect x="410" y="30" width="160" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <text x="490" y="51" text-anchor="middle" fill="#10b981" font-family="system-ui" font-size="12" font-weight="bold">💎 9H DIAMOND SHIELD</text>
</svg>
