<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="anodizedGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgDock)" rx="16"/>

  <ellipse cx="300" cy="340" rx="160" ry="22" fill="#020617" opacity="0.6"/>

  <!-- Dock Body -->
  <rect x="150" y="140" width="300" height="120" rx="20" fill="url(#anodizedGray)" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Port Sockets -->
  <!-- 2x HDMI 4K -->
  <rect x="180" y="165" width="40" height="16" rx="3" fill="#020617" stroke="#38bdf8"/>
  <text x="200" y="177" text-anchor="middle" fill="#38bdf8" font-size="8" font-family="system-ui" font-weight="bold">HDMI 1</text>
  <rect x="230" y="165" width="40" height="16" rx="3" fill="#020617" stroke="#38bdf8"/>
  <text x="250" y="177" text-anchor="middle" fill="#38bdf8" font-size="8" font-family="system-ui" font-weight="bold">HDMI 2</text>

  <!-- Gigabit Ethernet -->
  <rect x="280" y="163" width="34" height="20" rx="4" fill="#020617" stroke="#10b981"/>
  <text x="297" y="176" text-anchor="middle" fill="#10b981" font-size="8" font-family="system-ui" font-weight="bold">LAN</text>

  <!-- 3x USB 3.2 10Gbps -->
  <rect x="324" y="165" width="32" height="14" rx="3" fill="#020617" stroke="#38bdf8"/>
  <rect x="364" y="165" width="32" height="14" rx="3" fill="#020617" stroke="#38bdf8"/>
  <rect x="404" y="165" width="32" height="14" rx="3" fill="#020617" stroke="#38bdf8"/>

  <!-- SD/MicroSD slots -->
  <rect x="180" y="205" width="45" height="8" rx="2" fill="#020617" stroke="#94a3b8"/>
  <rect x="235" y="205" width="25" height="6" rx="2" fill="#020617" stroke="#94a3b8"/>

  <!-- 100W PD In -->
  <rect x="280" y="202" width="50" height="15" rx="6" fill="#020617" stroke="#f59e0b"/>
  <text x="305" y="213" text-anchor="middle" fill="#f59e0b" font-size="8" font-family="system-ui" font-weight="bold">100W PD</text>

  <!-- Braided Host Cord -->
  <path d="M 150,200 C 100,200 80,140 120,110" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  <rect x="110" y="90" width="30" height="18" rx="4" fill="#64748b"/>

  <rect x="400" y="30" width="170" height="32" rx="16" fill="rgba(14, 165, 233, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="485" y="51" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold">🖥️ DUAL 4K 60Hz DOCK</text>
</svg>
