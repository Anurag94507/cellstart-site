<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNano" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="nanoBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgNano)" rx="16"/>
  
  <ellipse cx="300" cy="330" rx="90" ry="18" fill="#020617" opacity="0.6"/>

  <!-- Tiny Nano Cube -->
  <rect x="235" y="140" width="130" height="130" rx="20" fill="url(#nanoBody)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="250" y="155" width="100" height="100" rx="14" fill="#0b1120"/>

  <!-- Single USB-C Port 30W -->
  <rect x="265" y="188" width="70" height="22" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="277" y="197" width="46" height="4" rx="2" fill="#38bdf8"/>
  <text x="300" y="235" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="900">30W NANO</text>

  <!-- Foldable Prongs Icon -->
  <rect x="280" y="115" width="10" height="25" rx="3" fill="#64748b"/>
  <rect x="310" y="115" width="10" height="25" rx="3" fill="#64748b"/>

  <rect x="420" y="30" width="150" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="495" y="51" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold">🪙 COIN-SIZED 30W</text>
</svg>
