<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cableBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="metalHead" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <pattern id="braid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 0,0 L 20,20 M 20,0 L 0,20" stroke="#475569" stroke-width="2" />
    </pattern>
    <filter id="cableGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#cableBg)" rx="16"/>

  <!-- Ambient Glow -->
  <circle cx="300" cy="200" r="140" fill="#06b6d4" opacity="0.12" filter="url(#cableGlow)"/>

  <!-- Braided Cord Curve -->
  <path d="M 80,320 C 120,180 200,80 340,110 C 440,130 520,260 420,320 C 340,360 220,280 200,180" fill="none" stroke="#1e293b" stroke-width="32" stroke-linecap="round"/>
  <path d="M 80,320 C 120,180 200,80 340,110 C 440,130 520,260 420,320 C 340,360 220,280 200,180" fill="none" stroke="#0ea5e9" stroke-width="24" stroke-dasharray="6 4" stroke-linecap="round"/>

  <!-- E-Marker Chip Housing (Connector 1) -->
  <g transform="translate(160, 120) rotate(-40)">
    <!-- Strain relief -->
    <rect x="-14" y="80" width="28" height="45" rx="6" fill="#334155"/>
    <line x1="-10" y1="90" x2="10" y2="90" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="-10" y1="100" x2="10" y2="100" stroke="#0ea5e9" stroke-width="2"/>
    <line x1="-10" y1="110" x2="10" y2="110" stroke="#0ea5e9" stroke-width="2"/>

    <!-- Aluminum Shell -->
    <rect x="-20" y="0" width="40" height="85" rx="8" fill="url(#metalHead)" stroke="#64748b" stroke-width="1.5"/>
    <!-- Smart E-Marker LED Ring -->
    <rect x="-16" y="24" width="32" height="6" rx="3" fill="#38bdf8" filter="url(#cableGlow)"/>
    <text x="0" y="55" text-anchor="middle" fill="#0f172a" font-family="system-ui" font-size="9" font-weight="900">100W</text>

    <!-- USB-C Plug -->
    <rect x="-12" y="-32" width="24" height="34" rx="5" fill="#cbd5e1" stroke="#94a3b8"/>
    <rect x="-7" y="-22" width="14" height="4" rx="2" fill="#334155"/>
  </g>

  <!-- Connector 2 -->
  <g transform="translate(420, 290) rotate(135)">
    <rect x="-14" y="80" width="28" height="40" rx="6" fill="#334155"/>
    <rect x="-20" y="0" width="40" height="85" rx="8" fill="url(#metalHead)" stroke="#64748b" stroke-width="1.5"/>
    <rect x="-16" y="24" width="32" height="6" rx="3" fill="#38bdf8" filter="url(#cableGlow)"/>
    <rect x="-12" y="-32" width="24" height="34" rx="5" fill="#cbd5e1" stroke="#94a3b8"/>
  </g>

  <!-- Badge in corner -->
  <rect x="420" y="30" width="150" height="32" rx="16" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
  <text x="495" y="51" text-anchor="middle" fill="#06b6d4" font-family="system-ui" font-size="12" font-weight="bold">🛡️ 30,000+ BENDS</text>
</svg>
